[package]
name = "procexp"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
libc = "0.2"
sysinfo = "0.38"
serde_json = "1"
core-foundation = "0.10"
core-foundation-sys = "0.8"
security-framework-sys = "2"
plist = "1"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
ureq = "2"
sha2 = "0.10"
eframe = { version = "=0.35.0", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
egui_extras = { version = "=0.35.0", default-features = false }

[dev-dependencies]
tempfile = "3"
